name: Cleanup merged branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method DELETE             "repos/$GITHUB_REPOSITORY/git/refs/heads/feat/topology-aware-affinity"
