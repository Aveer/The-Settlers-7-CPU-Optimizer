name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-powershell:
    name: Validate PowerShell
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\settlers7-cpu-optimizer.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Smoke-test topology API with Windows PowerShell 5.1
        shell: powershell
        run: |
          . .\settlers7-cpu-optimizer.ps1 -NoRun
          $topology = @(Get-SystemCoreTopology)

          if ($topology.Count -lt 1) {
            throw "Windows returned no processor-core topology records."
          }

          $plan = Get-AffinityPlan -CoreTopology $topology

          if ($plan.AffinityMask -eq 0) {
            throw "Topology-derived affinity mask is empty."
          }

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./settlers7-cpu-optimizer.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Smoke-test topology API with PowerShell 7
        shell: pwsh
        run: |
          . ./settlers7-cpu-optimizer.ps1 -NoRun
          $topology = @(Get-SystemCoreTopology)

          if ($topology.Count -lt 1) {
            throw "Windows returned no processor-core topology records."
          }

          $plan = Get-AffinityPlan -CoreTopology $topology

          if ($plan.AffinityMask -eq 0) {
            throw "Topology-derived affinity mask is empty."
          }

      - name: Install pinned test and analysis tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./settlers7-cpu-optimizer.ps1 -Severity Error

          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
